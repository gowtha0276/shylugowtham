<div class="main-container" [class.open]="isOpen">
  <div class="background-image"></div>
  <div class="overlay"></div>

  <div class="content" [class.show]="isOpen">
    <div class="content-top">
      <div class="welcome">THE WEDDING CELEBRATION OF</div>
    </div>

    <div class="content-middle">
      <div class="names">Shylu</div>
      <div class="elegant-divider">
        <div class="line-left"></div>
        <div class="tiny-heart">♥</div>
        <div class="line-right"></div>
      </div>
      <div class="names">Gowtham</div>
      <div class="date-section">
        <span class="calendar-icon">📅</span>
        <span class="date-text">June 17, 18</span>
      </div>
    </div>

    <div class="content-bottom">
      <div class="subtitle">
        Respect the honour of your presence
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="scroll-line"></div>
    <div class="scroll-arrow">↓</div>
  </div>

  <div class="curtain left-curtain"></div>
  <div class="curtain right-curtain"></div>

  <button class="open-btn" (click)="openCurtain()"></button>
</div>

<!-- Spacer for scrolling -->
<div class="spacer-section"></div>

<!-- Countdown Timer Section -->
<div class="countdown-section" [class.show]="showCountdown">
  <div class="countdown-container">
    <h2 class="countdown-title">Counting down to forever</h2>
    
    <div class="countdown-grid">
      <div class="countdown-box">
        <div class="countdown-value">{{ days }}</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-value">{{ hours }}</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-value">{{ minutes }}</div>
        <div class="countdown-label">Minutes</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-value">{{ seconds }}</div>
        <div class="countdown-label">Seconds</div>
      </div>
    </div>
  </div>
</div>
